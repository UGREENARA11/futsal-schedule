
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フットサル日程調整</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 16px;
      background: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 16px;
    }

    h1 { font-size: 18px; margin: 0 0 8px; }
    h2 { font-size: 14px; margin-top: 24px; }
    .sub { font-size: 12px; color: #777; }

    .status {
      background: #d9f5e3;
      color: #168348;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .date-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px 8px;
      margin-bottom: 12px;
    }

    .date-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .choices { display: flex; gap: 8px; }

    .choice {
      flex: 1;
      border: 1px solid #ddd;
      background: #fff;
      padding: 10px 0;
      border-radius: 30px;
      color: #888;
      cursor: pointer;
      font-size: 15px;
    }

    .choice.selected {
      background: #e5e5e5;
      color: #222;
      border-color: #999;
      font-weight: bold;
    }

    button.main {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #258b58;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    button.sub-button {
      border: 0;
      background: none;
      color: #2675bd;
      text-decoration: underline;
      cursor: pointer;
      padding: 10px 0;
    }

    .message { margin-top: 12px; font-size: 13px; }
    .summary {
      margin: 20px 8px 8px;
      font-size: 13px;
      line-height: 1.8;
    }

    .note {
      color: #888;
      font-size: 11px;
      margin-top: 20px;
    }

    .panel {
      margin-top: 20px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    .token {
      display: block;
      padding: 12px;
      margin: 10px 0;
      background: #eee;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .hidden { display: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<div class="container">

  <header>
    <div>
      <h1>フットサル日程調整</h1>
      <div class="sub">開催候補日を選んでください</div>
    </div>
    <span class="status">回答受付中</span>
  </header>

  <div id="authArea" class="panel">
    <h2 id="authTitle">新規登録</h2>

    <label for="name">名前</label>
    <input id="name" type="text" maxlength="30"
      placeholder="名前を入力してください">

    <div id="tokenArea" class="hidden">
      <label for="token">編集コード</label>
      <input id="token" type="text"
        placeholder="編集コードを入力してください"
        autocomplete="off">
    </div>

    <button id="authButton" class="main" type="button">
      新規登録
    </button>

    <button id="switchAuth" class="sub-button" type="button">
      登録済みの方はこちら
    </button>

    <div id="tokenResult" class="hidden">
      <p><strong>あなたの編集コードです。</strong></p>
      <p>別の端末でログインするときに必要です。必ず控えてください。</p>
      <div id="issuedToken" class="token"></div>
      <button id="copyToken" class="main" type="button">
        編集コードをコピー
      </button>
    </div>
  </div>

  <div id="userArea" class="panel hidden">
    <span id="loggedInName"></span> さんでログイン中
    <button id="logoutButton" class="sub-button" type="button">
      別の参加者として利用する
    </button>
  </div>

  <h2>参加可能日を入力</h2>
  <div id="dates">日程を読み込んでいます...</div>

  <button id="saveButton" class="main" type="button" disabled>
    回答を保存
  </button>

  <div id="message" class="message"></div>

  <div class="summary">
    <div style="color:#888;">回答イメージ</div>
    <strong>あなたの回答：<span id="answer">未選択</span></strong>
  </div>

  <div class="note">
    ※回答を保存すると、データベースに登録されます。
  </div>

</div>

<script>
  // Supabase接続情報
  const SUPABASE_URL = "https://kbfrqkuztmgoycnwhhna.supabase.co";
  const SUPABASE_KEY = "sb_publishable_a95rfXMoGGUFrylBXDirsQ_MpEms3EI";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  // Edge FunctionのURL
  const FUNCTION_URL =
    SUPABASE_URL.replace(/\/$/, "") +
    "/functions/v1/participant-auth";

  const STORAGE_KEY = "futsal_edit_token";

  const datesArea = document.getElementById("dates");
  const nameInput = document.getElementById("name");
  const answerArea = document.getElementById("answer");
  const messageArea = document.getElementById("message");
  const saveButton = document.getElementById("saveButton");

  const authArea = document.getElementById("authArea");
  const authTitle = document.getElementById("authTitle");
  const authButton = document.getElementById("authButton");
  const switchAuth = document.getElementById("switchAuth");
  const tokenArea = document.getElementById("tokenArea");
  const tokenInput = document.getElementById("token");
  const tokenResult = document.getElementById("tokenResult");
  const issuedToken = document.getElementById("issuedToken");
  const userArea = document.getElementById("userArea");
  const loggedInName = document.getElementById("loggedInName");

  let events = [];
  const answers = {};
  let currentUser = null;
  let currentToken = null;
  let loginMode = "register";

  // Edge Functionを呼び出す
  async function callFunction(action, data = {}) {
    const result = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },
      body: JSON.stringify({
        action,
        ...data
      })
    });

    const resultData = await result.json();

    if (!result.ok || !resultData.success) {
      throw new Error(
        resultData.error || "通信に失敗しました"
      );
    }

    return resultData;
  }

  // 登録画面とログイン画面を切り替え
  function setLoginMode(mode) {
    loginMode = mode;
    tokenResult.classList.add("hidden");
    nameInput.value = "";
    tokenInput.value = "";

    if (mode === "register") {
      authTitle.textContent = "新規登録";
      authButton.textContent = "新規登録";
      tokenArea.classList.add("hidden");
      switchAuth.textContent = "登録済みの方はこちら";
    } else {
      authTitle.textContent = "登録済みの方";
      authButton.textContent = "ログイン";
      tokenArea.classList.remove("hidden");
      switchAuth.textContent = "初めての方はこちら";
    }

    messageArea.textContent = "";
  }

  switchAuth.addEventListener("click", () => {
    setLoginMode(
      loginMode === "register" ? "login" : "register"
    );
  });

  // ログイン状態を画面に反映
  async function finishLogin(user, token) {
    currentUser = user;
    currentToken = token;

    localStorage.setItem(STORAGE_KEY, token);

    authArea.classList.add("hidden");
    userArea.classList.remove("hidden");
    loggedInName.textContent = user.user_name;

    saveButton.disabled = false;

    await loadAnswers();
  }

  // 初回登録・別端末ログイン
  authButton.addEventListener("click", async () => {
    messageArea.textContent = "";

    const name = nameInput.value.trim();

    if (!name) {
      alert("名前を入力してください");
      return;
    }

    authButton.disabled = true;

    try {
      if (loginMode === "register") {
        const result = await callFunction("register", {
          user_name: name
        });

        currentToken = result.token;
        localStorage.setItem(STORAGE_KEY, result.token);

        issuedToken.textContent = result.token;
        tokenResult.classList.remove("hidden");

        await finishLogin(result.user, result.token);

        messageArea.textContent =
          "登録しました。編集コードを必ず控えてください。";

      } else {
        const token = tokenInput.value.trim();

        if (!token) {
          alert("編集コードを入力してください");
          return;
        }

        const result = await callFunction("authenticate", {
          token
        });

        if (result.user.user_name !== name) {
          throw new Error("名前または編集コードが違います");
        }

        await finishLogin(result.user, token);
        messageArea.textContent = "ログインしました。";
      }

    } catch (error) {
      console.error(error);
      messageArea.textContent = error.message;
      alert(error.message);

    } finally {
      authButton.disabled = false;
    }
  });

  // 編集コードをコピー
  document.getElementById("copyToken").addEventListener(
    "click",
    async () => {
      try {
        await navigator.clipboard.writeText(
          issuedToken.textContent
        );
        alert("編集コードをコピーしました");
      } catch (error) {
        alert("コピーできませんでした。コードを手動で控えてください。");
      }
    }
  );

  // ログアウト
  document.getElementById("logoutButton").addEventListener(
    "click",
    () => {
      localStorage.removeItem(STORAGE_KEY);
      currentUser = null;
      currentToken = null;

      Object.keys(answers).forEach(key => delete answers[key]);

      userArea.classList.add("hidden");
      authArea.classList.remove("hidden");
      saveButton.disabled = true;

      setLoginMode("login");
      renderEvents();
      updateAnswerDisplay();
    }
  );

  // 開催候補日を取得
  async function loadEvents() {
    const { data, error } = await supabaseClient
      .from("Events")
      .select("*")
      .order("event_date", { ascending: true });

    if (error) {
      console.error(error);
      datesArea.textContent = "日程の取得に失敗しました。";
      return;
    }

    events = data || [];
    renderEvents();
  }

  // 日程を画面に表示
  function renderEvents() {
    datesArea.innerHTML = "";

    if (events.length === 0) {
      datesArea.textContent = "開催候補日が登録されていません。";
      return;
    }

    events.forEach(event => {
      const card = document.createElement("div");
      card.className = "date-card";

      const dateText = new Date(
        event.event_date + "T00:00:00"
      ).toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      });

      const title = document.createElement("div");
      title.className = "date-title";
      title.textContent = event.event_name || dateText;

      const choices = document.createElement("div");
      choices.className = "choices";

      ["〇", "△", "×"].forEach(value => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = value;
        button.type = "button";

        if (answers[event.id] === value) {
          button.classList.add("selected");
        }

        button.addEventListener("click", () => {
          if (!currentUser) {
            alert("先にログインしてください");
            return;
          }

          answers[event.id] = value;

          choices.querySelectorAll(".choice").forEach(item => {
            item.classList.remove("selected");
          });

          button.classList.add("selected");
          updateAnswerDisplay();
        });

        choices.appendChild(button);
      });

      card.appendChild(title);
      card.appendChild(choices);
      datesArea.appendChild(card);
    });

    updateAnswerDisplay();
  }

  // 本人の過去の回答を取得
  async function loadAnswers() {
    const result = await callFunction("get-answers", {
      token: currentToken
    });

    Object.keys(answers).forEach(key => delete answers[key]);

    result.answers.forEach(item => {
      answers[item.event_id] = item.answer;
    });

    renderEvents();
    messageArea.textContent = "以前の回答を読み込みました。";
  }

  // 回答イメージを更新
  function updateAnswerDisplay() {
    answerArea.textContent = events
      .map(event => answers[event.id] || "未選択")
      .join("・");
  }

  // 回答を保存
  saveButton.addEventListener("click", async () => {
    messageArea.textContent = "";

    if (!currentUser || !currentToken) {
      alert("ログインしてください");
      return;
    }

    if (events.length === 0) {
      alert("開催候補日がありません");
      return;
    }

    if (events.some(event => !answers[event.id])) {
      alert("すべての日程に回答してください");
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "保存中...";

    try {
      const records = events.map(event => ({
        event_id: event.id,
        answer: answers[event.id]
      }));

      await callFunction("save-answers", {
        token: currentToken,
        answers: records
      });

      messageArea.textContent = "回答を保存しました！";
      alert("回答を保存しました！");

    } catch (error) {
      console.error(error);
      messageArea.textContent =
        "保存に失敗しました：" + error.message;
      alert("保存に失敗しました。");

    } finally {
      saveButton.disabled = false;
      saveButton.textContent = "回答を保存";
    }
  });

  // ページを開いたとき
  async function initialize() {
    await loadEvents();

    const savedToken = localStorage.getItem(STORAGE_KEY);

    if (!savedToken) {
      return;
    }

    try {
      const result = await callFunction("authenticate", {
        token: savedToken
      });

      await finishLogin(result.user, savedToken);

    } catch (error) {
      console.error(error);
      localStorage.removeItem(STORAGE_KEY);
      messageArea.textContent =
        "自動ログインできませんでした。編集コードでログインしてください。";
      setLoginMode("login");
    }
  }

  initialize();
</script>
</body>
</html>

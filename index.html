
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フットサル日程調整</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #333;
    }

    h1 {
      color: #176b45;
      text-align: center;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #176b45;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>フットサル日程調整</h1>
    <p>次回のフットサルの参加予定を確認しましょう。</p>

    <h2>開催予定</h2>
    <p>開催日：未設定</p>
    <p>場所：未設定</p>

    <h2>参加確認</h2>
    <p>参加できる日程を確認して、回答してください。</p>
    <button onclick="alert('日程調整機能はこれから作成します！')">
      参加予定を確認
    </button>
  </div>
</body>
</html>


<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フットサル日程調整</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #333;
    }

    h1 {
      color: #176b45;
      text-align: center;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #176b45;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>フットサル日程調整</h1>
    <p>次回のフットサルの参加予定を確認しましょう。</p>

    <h2>開催予定</h2>
    <p>開催日：未設定</p>
    <p>場所：未設定</p>

<h2>参加者登録</h2>

<div>
  <label for="userName">名前：</label>
  <input
    type="text"
    id="userName"
    placeholder="例：山田太郎"
  >
  <button id="registerButton">新規登録</button>
</div>

<p id="registerMessage"></p>

    <h2>参加確認</h2>
    <p>参加できる日程を確認して、回答してください。</p>
    <button onclick="alert('日程調整機能はこれから作成します！')">
      参加予定を確認
    </button>
    <a href="https://yoyaku.fcjapan.jp/team/scripts/user/faci_schedule.php?faci_id=55" target="_blank">
      コートの予約状況を確認する
    </a>
  </div>
  <script type="module">
  import { createClient } from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://kbfrqkuztmgoycnwhhna.supabase.co';
const SUPABASE_KEY = 'sb_publishable_a95rfXMoGGUFrylBXDirsQ_MpEms3EI';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById('registerButton')
  .addEventListener('click', async () => {

    const name = document.getElementById('userName')
      .value.trim();

    const message = document.getElementById('registerMessage');

    if (!name) {
      message.textContent = '名前を入力してください。';
      return;
    }

    // 編集用のランダムなトークンを作成
    const token = crypto.randomUUID();

    // SHA-256でハッシュ化
    const buffer = await crypto.subtle.digest(
      'SHA-256',
      new TextEncoder().encode(token)
    );

    const hash = Array.from(new Uint8Array(buffer))
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');

    // Supabaseに登録
    const { data, error } = await supabase
      .from('UserName')
      .insert({
        user_name: name,
        edit_token_hash: hash
      })
      .select('id, user_name')
      .single();

    if (error) {
      console.error(error);
      message.textContent = '登録に失敗しました。';
      return;
    }

    // この端末に編集用トークンを保存
    localStorage.setItem(
      'futsal_edit_token',
      token
    );

    localStorage.setItem(
      'futsal_user_id',
      data.id
    );

    message.textContent =
      name + ' さんの登録が完了しました！';

    console.log('登録成功:', data);
  });
</script>
</body>
</html>

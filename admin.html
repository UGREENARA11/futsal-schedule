<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フットサル管理者画面</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .form-area {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      margin-top: 25px;
      background: #16834a;
      color: white;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>フットサル管理者画面</h1>

  <div class="form-area">
    <h2>開催日程の追加</h2>

    <label>開催日</label>
    <input type="date" id="event_date">

    <label>屋根の有無</label>
    <select id="roof_type">
      <option value="屋根あり">屋根あり</option>
      <option value="屋根なし">屋根なし</option>
    </select>

    <label>利用時間</label>
    <input type="number" id="hours" min="0.5" step="0.5" placeholder="例：2">

    <label>1時間あたりのコート代（円）</label>
    <input type="number" id="hourly_cost" min="0" placeholder="例：5000">

    <button type="button" id="registerButton">日程を登録</button>
  </div>

</body>
<script>
const SUPABASE_URL = "https://kbfrqkuztmgoycnwhhna.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_a95rfXMoGGUFrylBXDirsQ_MpEms3EI";
  
  document.getElementById("registerButton").addEventListener("click", async () => {
    const event_date = document.getElementById("event_date").value;
    const roof_type = document.getElementById("roof_type").value;
    const hours = Number(document.getElementById("hours").value);
    const hourly_cost = Number(document.getElementById("hourly_cost").value);

    if (!event_date || !hours || !hourly_cost) {
      alert("すべての項目を入力してください");
      return;
    }

    try {
  const response = await fetch(
    `${SUPABASE_URL}/functions/v1/create-event`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify({
        event_date,
        roof_type,
        hours,
        hourly_cost
      })
    }
  );

  const result = await response.json();

  if (!response.ok) {
    alert("登録に失敗しました：" + (result.error || response.status));
    return;
  }

  alert("日程を登録しました！");
} catch (error) {
  alert("通信エラーが発生しました：" + error.message);
}
    
  });
</script>
  
</html>
